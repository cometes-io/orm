name: cometes-orm

services:
  postgres:
    image: postgres:18-alpine
    container_name: cometes-orm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orm
      POSTGRES_PASSWORD: orm
      POSTGRES_DB: orm
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - orm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orm -d orm"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: cometes/orm
    build:
      context: ..
      dockerfile: examples/Dockerfile
    container_name: cometes-orm-migrate
    command: ["npm", "run", "migrate"]
    environment:
      POSTGRES_URL: postgres://orm:orm@postgres:5432/orm
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orm-net
    restart: "no"

networks:
  orm-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
